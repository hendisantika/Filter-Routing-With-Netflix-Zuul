# Builds and tests both microservices (login & gateway) with Maven on JDK 25.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.module }} (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module: [ login, gateway ]
        java: [ '25' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml

      - name: Build & test with Maven
        run: mvn -B -ntp verify --file ./${{ matrix.module }}/pom.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.module }}
          path: ${{ matrix.module }}/target/surefire-reports/
          if-no-files-found: ignore

  dependency-graph:
    # Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts.
    name: Submit dependency graph (${{ matrix.module }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        module: [ login, gateway ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml

      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@v6
        with:
          directory: ${{ matrix.module }}
          correlator: ${{ github.job }}-${{ matrix.module }}
